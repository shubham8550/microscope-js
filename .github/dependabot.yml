version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      pdfjs:
        patterns: ["pdfjs-dist"]
      office:
        patterns: ["mammoth", "xlsx", "jszip"]
      dev:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
