name: Pages (demo + docs)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Build demo (static export)
        env:
          GITHUB_PAGES: 'true'
        run: pnpm --filter @microscope-js/demo build

      - name: Generate TypeDoc
        run: pnpm run docs

      - name: Assemble Pages bundle
        run: |
          mkdir -p site
          cp -R apps/demo/out/* site/
          mkdir -p site/docs
          cp -R docs-site/* site/docs/
          # disable Jekyll so files like _next/ are served as-is
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
