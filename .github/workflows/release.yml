name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version + publish
    runs-on: ubuntu-latest
    # OIDC Trusted Publishing to npm — no NPM_TOKEN secret used.
    # Each package must be registered as a Trusted Publisher at
    # https://www.npmjs.com/package/<name>/access (see RELEASING.md).
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publisher OIDC exchange requires npm >= 11.5
      - name: Pin npm to a Trusted-Publisher-capable version
        run: |
          corepack enable
          corepack prepare npm@11.6.2 --activate
          npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SLSA provenance + tokenless trusted publishing via GitHub OIDC
          NPM_CONFIG_PROVENANCE: 'true'
