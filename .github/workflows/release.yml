name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version + publish
    runs-on: ubuntu-latest
    # OIDC Trusted Publishing to npm — no NPM_TOKEN secret used.
    # Each package must be registered as a Trusted Publisher at
    # https://www.npmjs.com/package/<name>/access (see RELEASING.md).
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: pnpm/action-setup@v4

      # NOTE: deliberately omit `registry-url` — setup-node otherwise writes
      # a temp .npmrc with `_authToken=${NODE_AUTH_TOKEN}`. changesets/action
      # then injects a placeholder token there, which makes npm think it's
      # authenticated and skip the OIDC trusted-publisher exchange.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Trusted Publisher OIDC exchange requires npm >= 11.5
      - name: Pin npm to a Trusted-Publisher-capable version
        run: |
          corepack enable
          corepack prepare npm@11.6.2 --activate
          npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Debug OIDC token claims + exchange
        run: |
          set +e
          echo "::group::Request OIDC token from GitHub"
          RESP=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")
          echo "(token resp keys: $(echo "$RESP" | jq -r 'keys | join(",")'))"
          TOKEN=$(echo "$RESP" | jq -r '.value')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "NO TOKEN"; echo "$RESP"; exit 0; fi
          echo "::endgroup::"
          echo "::group::Decode JWT payload"
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # base64url -> base64
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="$PAYLOAD$(printf '=%.0s' $(seq 1 $PAD))"
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{aud,repository,repository_owner,workflow_ref,job_workflow_ref,environment,ref,sub}'
          echo "::endgroup::"
          echo "::group::Exchange JWT for npm publish token"
          curl -sS -X POST https://registry.npmjs.org/-/npm/v1/oidc/exchange/token \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$TOKEN\"}" \
            -w "\nHTTP %{http_code}\n"
          echo "::endgroup::"

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SLSA provenance + tokenless trusted publishing via GitHub OIDC
          NPM_CONFIG_PROVENANCE: 'true'
